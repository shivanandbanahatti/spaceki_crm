[project]
name = "spaceki_crm"
authors = [
    { name = "shivanandbanahatti", email = "shivanandbanahatti@gmail.com" }
]
description = "Spaceki enterprise customizations for Frappe CRM"
requires-python = ">=3.10"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<=17.0.0-dev"
crm = ">=2.0.0"
